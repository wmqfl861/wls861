name: C++20 runtime and specification contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Linux C++20 (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # The 78-suite ASan jobs exhausted the former 40-minute total budget.
    # Make reached the final integration suite after almost 39 minutes; the
    # same-source CMake suite took 497.88s, with two Make suites still after it.
    # Reserve 55 minutes only for ASan. Keep all per-test deadlines, assertions,
    # leak checks, ordinary-user checks and the original Make CPPFLAGS path.
    timeout-minutes: ${{ matrix.asan == 'ON' && 55 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: strict
            compiler: g++
            build_type: Release
            ubsan: "OFF"
            asan: "OFF"
            test_umask: "0022"
          - name: strict-umask-0002
            compiler: g++
            build_type: Release
            ubsan: "OFF"
            asan: "OFF"
            test_umask: "0002"
          - name: UBSan
            compiler: g++
            build_type: Debug
            ubsan: "ON"
            asan: "OFF"
            test_umask: "0002"
          - name: ASan
            compiler: g++
            build_type: Debug
            ubsan: "OFF"
            asan: "ON"
            test_umask: "0002"
          - name: Make-ASan
            compiler: g++
            build_type: Debug
            ubsan: "OFF"
            asan: "ON"
            test_umask: "0002"
          - name: Clang-18
            compiler: clang++-18
            build_type: Release
            ubsan: "OFF"
            asan: "OFF"
            test_umask: "0002"
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install C++ development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost1.83-dev libsqlite3-dev libssl-dev libcurl4-openssl-dev libyaml-dev openssl
          if [ "${{ matrix.compiler }}" = clang++-18 ]; then
            sudo apt-get install --yes clang-18
          fi
          if [ "${{ matrix.name }}" = ASan ]; then
            sudo apt-get install --yes g++-13
          fi
      - name: Prepare contract-test environment
        run: |
          python3 -m venv .local/test-venv
          .local/test-venv/bin/python -m pip install -r requirements-test.txt
      - name: Check shared GCC ASan runner contracts
        if: matrix.name == 'strict' || matrix.name == 'ASan'
        run: .local/test-venv/bin/python tests/test_run_gcc_asan.py
      - name: Check immediate failure diagnostics survive suite interruption
        if: matrix.name == 'strict' || matrix.name == 'ASan'
        run: .local/test-venv/bin/python -B tests/test_immediate_unittest.py
      - name: Run shared GCC 13.3 Debug ASan gate
        if: matrix.name == 'ASan'
        run: |
          .local/test-venv/bin/python scripts/run_gcc_asan.py --compiler g++-13 --python "$GITHUB_WORKSPACE/.local/test-venv/bin/python" --expected-tests 89
      - name: Retain GCC ASan evidence including failures
        if: always() && matrix.name == 'ASan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcc-asan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-gcc-asan-*/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Configure CMake
        if: matrix.name != 'Make-ASan' && matrix.name != 'ASan'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWLS_ENABLE_UBSAN=${{ matrix.ubsan }} -DWLS_ENABLE_ASAN=${{ matrix.asan }} -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.local/test-venv/bin/python"
      - name: Build with warnings as errors
        if: matrix.name != 'Make-ASan' && matrix.name != 'ASan'
        run: cmake --build build --parallel 2
      - name: Run complete CTest as an ordinary user
        if: matrix.name != 'Make-ASan' && matrix.name != 'ASan'
        run: |
          test "$(id -u)" -ne 0
          umask "${{ matrix.test_umask }}"
          ctest --test-dir build --output-on-failure
      - name: Verify the original GCC ASan Make target and user CPPFLAGS
        if: matrix.name == 'Make-ASan'
        run: |
          test "$(id -u)" -ne 0
          umask 0002
          make -j2 asan BUILD_DIR=build-make CPPFLAGS=-DWLS_CI_USER_CPPFLAGS=1 PYTHON="$GITHUB_WORKSPACE/.local/test-venv/bin/python"
