name: Validate and publish exact S1.6 development tree

on:
  push:
    branches: [work/s1.6-owned-cleanup]
    paths: ['.development/s16/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'wmqfl861/wls861' && github.ref == 'refs/heads/work/s1.6-owned-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out the publishing branch without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and apply the exact locally tested source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 860e27388889e868f85d79dbdda5f9a3ed486e2d HEAD -- . ':(exclude).development/s16/**' ':(exclude).github/workflows/publish-s16.yml'
          test "$(find .development/s16 -maxdepth 1 -type f | wc -l)" -eq 12
          cat .development/s16/part-{00..11} > "$RUNNER_TEMP/s16.patch.xz"
          echo 'a7372cea303620a63289f30b91f9fc127a92e1f10e2461c5d264cad1af685099  '"$RUNNER_TEMP/s16.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/s16.patch.xz" > "$RUNNER_TEMP/s16.patch"
          echo 'a51996dbf99db795c24bc84413dd3c50d505a80e88a47bf983f6e29e937abbba  '"$RUNNER_TEMP/s16.patch" | sha256sum -c -
          git apply --check --index "$RUNNER_TEMP/s16.patch"
          git apply --index "$RUNNER_TEMP/s16.patch"
          git rm -r .development/s16
          git update-index --force-remove .github/workflows/publish-s16.yml
          test "$(git write-tree)" = feeb86ce668d2f7840f8a28d6ca7153327a2aeeb
          git add .github/workflows/publish-s16.yml
          git diff --cached --check
          sha256sum -c docs/reports/s1.6-source-SHA256SUMS.txt
      - name: Install build and contract-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libboost1.83-dev libsqlite3-dev libssl-dev libyaml-dev
          python3 -m venv .local/test-venv
          .local/test-venv/bin/python -m pip install -r requirements-test.txt
      - name: Strict release build and complete CTest
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-s16-release -DCMAKE_BUILD_TYPE=Release -DWLS_ENABLE_UBSAN=OFF -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.local/test-venv/bin/python"
          cmake --build build-s16-release --parallel 2
          ctest --test-dir build-s16-release --output-on-failure
      - name: UBSan build and complete CTest
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-s16-ubsan -DCMAKE_BUILD_TYPE=Debug -DWLS_ENABLE_UBSAN=ON -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.local/test-venv/bin/python"
          cmake --build build-s16-ubsan --parallel 2
          ctest --test-dir build-s16-ubsan --output-on-failure
      - name: Commit only the verified source to the development branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          sha256sum -c docs/reports/s1.6-source-SHA256SUMS.txt
          git diff --exit-code
          git diff --cached --check
          git update-index --force-remove .github/workflows/publish-s16.yml
          test "$(git write-tree)" = feeb86ce668d2f7840f8a28d6ca7153327a2aeeb
          git add .github/workflows/publish-s16.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(s1): add owned workspace cleanup with durable recovery' -m 'Implement 0.7.0-s1.6: additive schema 407, host-created resource ownership, fixed deletion inventories, original process exit gates, existing-delivery reverification and resumable checkpoints. Preserve private records and delivery packages; do not claim global CLEANED. Synchronize blueprint, roadmap, task cards, implementation contract and measured validation. Strict release and UBSan each passed all 32 CTest groups on this exact source tree.'
          askpass="$RUNNER_TEMP/s16-git-askpass"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" git push origin HEAD:refs/heads/work/s1.6-owned-cleanup
          mkdir -p "$RUNNER_TEMP/s16-tested-history"
          git bundle create "$RUNNER_TEMP/s16-tested-history/tested.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/s16-tested-history/COMMIT"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/s16-tested-history/TREE"
          (cd "$RUNNER_TEMP/s16-tested-history" && sha256sum tested.bundle > SHA256SUMS)
      - name: Retain tested history for exact local synchronization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s16-tested-history
          path: ${{ runner.temp }}/s16-tested-history/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
