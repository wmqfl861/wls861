name: Verifiable committed source snapshot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One snapshot run per workflow per ref: a newer run for the same pull
  # request or branch cancels the superseded run, and different pull requests
  # never cancel each other. A cancelled run reports CANCELLED, never a pass.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive committed source only
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-snapshot"
          # COMMIT, TREE and SHA256SUMS always describe the revision that was
          # actually checked out and archived: for a pull request this is the
          # merge ref, and that snapshot is never relabelled as the PR head's
          # bytes.
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/source-snapshot/source.tar.gz"
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$commit" > "$RUNNER_TEMP/source-snapshot/COMMIT"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/source-snapshot/TREE"
          (cd "$RUNNER_TEMP/source-snapshot" && sha256sum source.tar.gz > SHA256SUMS)
          {
            echo "commit=$commit"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Source snapshot provenance'
            echo "- event: $GITHUB_EVENT_NAME"
            echo "- event sha (github.sha): $GITHUB_SHA"
            echo "- archived commit (exactly as checked out): $commit"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the exact source and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ steps.archive.outputs.commit }}
          path: ${{ runner.temp }}/source-snapshot/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
