name: Verify and publish exact R1.2 structured input commits

on:
  push:
    branches: [work/r12-publish-f89cb04]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'wmqfl861/wls861' && github.ref == 'refs/heads/work/r12-publish-f89cb04'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out transport without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source transport and reconstruct original commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(find .development/r12 -type f | wc -l)" -eq 4
          cat .development/r12/part-{00..03} > "$RUNNER_TEMP/r12.tar.xz"
          echo '47d7b9cebae3dd59f701c31686051a1e70d58eaf14a7d9cec92ace9e372cf671  '"$RUNNER_TEMP/r12.tar.xz" | sha256sum -c -
          python3 - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r12-series'
          root.mkdir()
          expected = {'manifest.json', '00.patch', '00.commit', '01.patch', '01.commit'}
          with tarfile.open(root.parent / 'r12.tar.xz', 'r:xz') as archive:
              members = archive.getmembers()
              assert len(members) == len(expected)
              assert {m.name for m in members} == expected
              assert all(m.isfile() and m.size < 1048576 for m in members)
              for member in members:
                  (root / member.name).write_bytes(archive.extractfile(member).read())
          PY
          git checkout --detach b493752a10d2ad66670d6b201b24b1f489df7931
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r12-series'
          manifest = json.loads((root / 'manifest.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = ['b0e5b60a7e1dd88e7ca24dc29f717f5f3fc39a23', 'f89cb041b38b58755b2c944fd28b9d0ec4946e0e']
          assert manifest['base'] == 'b493752a10d2ad66670d6b201b24b1f489df7931'
          assert [e['sha'] for e in manifest['commits']] == expected
          for entry in manifest['commits']:
              assert git('rev-parse', 'HEAD') == entry['parent']
              patch = str(root / (entry['prefix'] + '.patch'))
              git('apply', '--check', '--index', patch)
              git('apply', '--index', patch)
              assert git('write-tree') == entry['tree']
              assert git('hash-object', '-t', 'commit', '-w', str(root / (entry['prefix'] + '.commit'))) == entry['sha']
              git('update-ref', 'HEAD', entry['sha'], entry['parent'])
              git('diff', '--exit-code')
              git('diff', '--cached', '--exit-code')
              print('Verified exact commit', entry['sha'], entry['tree'])
          assert git('write-tree') == 'f2efcb38eac7194508225534319c9f7ea33ac7ef'
          assert not pathlib.Path('.development/r12').exists()
          assert not pathlib.Path('.github/workflows/import-r12.yml').exists()
          assert pathlib.Path('.github/workflows/ci.yml').is_file()
          PY
      - name: Install build and reference-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost1.83-dev libsqlite3-dev libssl-dev libyaml-dev
          python3 -m venv .local/test-venv
          .local/test-venv/bin/python -m pip install -r requirements-test.txt
      - name: Complete ordinary-user Release regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          umask 0002
          cmake -S . -B build-r12-import -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.local/test-venv/bin/python"
          cmake --build build-r12-import --parallel 2
          ctest --test-dir build-r12-import --output-on-failure
          test "$(git rev-parse HEAD)" = f89cb041b38b58755b2c944fd28b9d0ec4946e0e
          test "$(git write-tree)" = f2efcb38eac7194508225534319c9f7ea33ac7ef
          git diff --exit-code
          git diff --cached --exit-code
      - name: Fast-forward only the expected implementation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/r12-askpass"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass"
          test "$(git ls-remote origin refs/heads/work/r12-structured-context | cut -f1)" = b493752a10d2ad66670d6b201b24b1f489df7931
          git push origin HEAD:refs/heads/work/r12-structured-context
          test "$(git ls-remote origin refs/heads/work/r12-structured-context | cut -f1)" = f89cb041b38b58755b2c944fd28b9d0ec4946e0e
