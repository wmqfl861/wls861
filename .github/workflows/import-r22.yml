name: Verify and publish integrated R2 recovery candidate

on:
  push:
    branches: [work/r22-transport-c975be3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'wmqfl861/wls861' && github.ref == 'refs/heads/work/r22-transport-c975be3'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out bounded transport without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reconstruct original commits and exact integration merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cat .development/r22/part-{00..05} > "$RUNNER_TEMP/r22.tar.xz"
          echo '76c4428a5632febe6d53dab41d680a785062817ed446707fda0a39f6a2daaa41  '"$RUNNER_TEMP/r22.tar.xz" | sha256sum -c -
          python3 - <<'PY'
          import os, pathlib, tarfile
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r22-series'
          dest.mkdir()
          expected = {'manifest.json'} | {f'{i:02d}.{ext}' for i in range(5) for ext in ('patch', 'commit')}
          with tarfile.open(dest.parent / 'r22.tar.xz', 'r:xz') as archive:
              members = archive.getmembers()
              assert len(members) == len(expected)
              assert {m.name for m in members} == expected
              assert all(m.isfile() and m.size < 1048576 for m in members)
              for m in members:
                  (dest / m.name).write_bytes(archive.extractfile(m).read())
          PY
          git checkout --detach 19ea603dd52bbcd0f34d29fb4b07f088d4f2693c
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r22-series'
          manifest = json.loads((root / 'manifest.json').read_text())
          expected = ['b3d0708dc96c92831bfde2ea7e1cc53600474db8', '1c5c45c758002b2cf5be0576e32a75d924c42c3d', 'e186734af4a895b73ee847d80889cea2e375fb54', '2ee0ec95c3c739c9253dd0093586200e50373648', 'c975be3e7d30c1208a0a2c19494e2a186c7f77ca']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert manifest['base'] == '19ea603dd52bbcd0f34d29fb4b07f088d4f2693c'
          assert [c['sha'] for c in manifest['commits']] == expected
          assert git('cat-file', '-t', manifest['dependency']) == 'commit'
          for entry in manifest['commits']:
              assert git('rev-parse', 'HEAD') == entry['parents'][0]
              for parent in entry['parents']:
                  assert git('cat-file', '-t', parent) == 'commit'
              patch = root / (entry['prefix'] + '.patch')
              assert hashlib.sha256(patch.read_bytes()).hexdigest() == entry['patch_sha256']
              git('apply', '--check', '--index', str(patch))
              git('apply', '--index', str(patch))
              assert git('write-tree') == entry['tree']
              sha = git('hash-object', '-t', 'commit', '-w', str(root / (entry['prefix'] + '.commit')))
              assert sha == entry['sha']
              assert git('show', '-s', '--format=%P', sha).split() == entry['parents']
              git('update-ref', 'HEAD', sha, entry['parents'][0])
              git('diff', '--exit-code')
              git('diff', '--cached', '--exit-code')
              print('Verified original commit', sha, 'tree', entry['tree'])
          assert git('rev-parse', 'HEAD^{tree}') == '8b6b682b4e486c8641e14aa266041cef89499638'
          assert not pathlib.Path('.development/r22').exists()
          assert not pathlib.Path('.github/workflows/import-r22.yml').exists()
          assert pathlib.Path('.github/workflows/ci.yml').is_file()
          git('merge-base', '--is-ancestor', manifest['dependency'], 'HEAD')
          git('diff', '--exit-code', manifest['base'], 'HEAD', '--', 'db', 'third_party', 'docs/handoff', 'docs/reviews/claude-2026-10-23.md', 'docs/reviews/claude-2026-10-24.md')
          PY
      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libboost1.83-dev libsqlite3-dev libssl-dev libyaml-dev
          python3 -m venv .local/test-venv
          .local/test-venv/bin/python -m pip install -r requirements-test.txt
      - name: Validate clean candidate as an ordinary user
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          umask 0002
          mkdir -p "$RUNNER_TEMP/r22-evidence"
          cmake -S . -B build-r22-import -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.local/test-venv/bin/python"
          cmake --build build-r22-import --parallel 2
          ctest --test-dir build-r22-import --output-on-failure -V | tee "$RUNNER_TEMP/r22-evidence/release.log"
          test "$(git rev-parse HEAD)" = c975be3e7d30c1208a0a2c19494e2a186c7f77ca
          test "$(git write-tree)" = 8b6b682b4e486c8641e14aa266041cef89499638
          git diff --exit-code
          git diff --cached --exit-code
      - name: Publish only the expected integration branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/r22-askpass"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass"
          actual=$(git ls-remote origin refs/heads/work/r2-integrated-recovery | cut -f1)
          test "$actual" = c27b860d4022aa5f0c05fca53d549608b9177d17
          git push origin HEAD:refs/heads/work/r2-integrated-recovery
          test "$(git ls-remote origin refs/heads/work/r2-integrated-recovery | cut -f1)" = c975be3e7d30c1208a0a2c19494e2a186c7f77ca
          git rev-parse HEAD > "$RUNNER_TEMP/r22-evidence/COMMIT"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/r22-evidence/TREE"
          git bundle create "$RUNNER_TEMP/r22-evidence/tested.bundle" HEAD
          (cd "$RUNNER_TEMP/r22-evidence" && sha256sum tested.bundle release.log > SHA256SUMS)
      - name: Preserve candidate validation and exact original history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r22-tested-history
          path: ${{ runner.temp }}/r22-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
