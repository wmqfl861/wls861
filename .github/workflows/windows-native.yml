name: Windows native foundation slice

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foundation:
    name: Windows native x64 build and format slice
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Preserve exact published resource bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          persist-credentials: false
      - name: Capture inherited image environment before selfchecks
        shell: pwsh
        run: |
          python source/platform/native-foundation/tools/run_windows_ci.py --source-root source --capture-image-environment native-image-environment.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check complete native evidence collection with synthetic CTest processes
        shell: pwsh
        run: |
          python source/platform/native-foundation/tools/test_windows_ci_evidence.py --retain-fixtures native-runner-selfcheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the owned process supervisor with injected synthetic APIs
        shell: pwsh
        timeout-minutes: 1
        run: |
          python source/platform/native-foundation/tools/test_windows_process_supervisor.py --mode synthetic --evidence-dir native-process-synthetic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the owned process supervisor against real native Windows processes
        shell: pwsh
        timeout-minutes: 5
        run: |
          python source/platform/native-foundation/tools/test_windows_process_supervisor.py --mode native --evidence-dir native-process-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check offline image provenance source binding
        shell: pwsh
        run: |
          python source/platform/native-foundation/tools/test_windows_image_provenance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify the isolated native slice with pinned preinstalled tools
        shell: pwsh
        run: |
          python source/platform/native-foundation/tools/run_windows_ci.py --source-root source --work-root native-work --image-environment-snapshot native-image-environment.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original native evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-image-environment.json
            native-work/evidence/
            native-process-synthetic/
            native-process-native/
            native-runner-selfcheck/
          if-no-files-found: warn
          retention-days: 7
