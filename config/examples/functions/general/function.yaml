# S1 C++ 配置按请求冻结；Fake 流程已接文件、问答、提交、验收和经验。
schema_version: 1
spec_version: 0.4.1
id: general
version: 1
description: 通用演示：文件、脚本和数据处理；真实能力完成前只用 fake。

# 每请求创建时冻结以下配置，后建团队和恢复继续用该快照。
root:
  model_ref: null
  reasoning: null
roles:
  dispatcher:
    model_ref: null
    reasoning: null
    prompt_append: prompts/dispatcher.md
  team_lead:
    model_ref: null
    reasoning: null
    prompt_append: prompts/team_lead.md
  worker:
    model_ref: null
    reasoning: null
    prompt_append: prompts/worker.md

team_templates:
  default:
    worker_tools: [fs_list, fs_read, fs_search, fs_write, fs_patch, run, op_status, op_output, op_cancel, ask, progress, ack_change, submit, note, recall, load_memory]
    network: none
    workspace: plain
    env: env.yaml
    isolation: strong

capabilities:
  - id: run
    input: free_text
    dispatch: plan
    default: true

pinned_skills: []

