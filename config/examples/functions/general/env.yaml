# 后续 S1 环境卡片定义（docs/spec/v0.4.1 主规格 9.8）：wlsd 加载模板时在沙箱里执行 check，
# 把结果渲染成卡片放进 Worker 的系统提示。optional 的工具缺失时卡片标注"未安装"，不报错。
schema_version: 1
tools:
  - name: bash
    check: "bash --version | head -1"
    usage: "执行 shell 命令（通过 run 工具）"
  - name: git
    check: "git --version"
    usage: "版本管理"
    example: "git -C /work status --short"
  - name: ripgrep
    check: "rg --version | head -1"
    usage: "按内容搜索文本；也可以直接用 fs_search 工具"
    example: "rg -n 'TODO' /work"
  - name: fd
    optional: true
    check: "fdfind --version || fd --version"
    usage: "按文件名查找（Ubuntu 上命令名是 fdfind）"
    example: "fdfind -e csv . /input"
  - name: python3
    check: "python3 --version"
    usage: "脚本与数据处理"
    example: "python3 /work/clean.py"
  - name: pandas
    check: "python3 -c 'import pandas; print(pandas.__version__)'"
    usage: "表格数据处理"
    optional: true
  - name: matplotlib
    check: "python3 -c 'import matplotlib; print(matplotlib.__version__)'"
    usage: "画图；在无图形界面的沙箱里用 Agg 后端保存为 PNG"
    example: "python3 -c \"import matplotlib; matplotlib.use('Agg')\""
    optional: true
  - name: jq
    check: "jq --version"
    usage: "处理 JSON"
    example: "jq '.items | length' /input/data.json"
  - name: curl
    check: "curl --version | head -1"
    usage: "HTTP 请求；network 为 none 时不可用"
    optional: true

notes: |
  - 卡片由模板版本、检查结果、工具版本和实际隔离能力共同标识；不是额外权限。
  - 工作区 /work 可写，输入 /input 只读；交付物请放在 /work/out/ 下。
  - 不能在运行时安装系统软件包；缺少的工具请在 ask 中说明，由用户在功能模板里预装。
